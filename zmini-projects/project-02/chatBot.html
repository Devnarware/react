<!DOCTYPE html>
<html>

<head>
  <title>React Basics</title>
</head>

<body>
  <div class="js-container"></div>

  <script src="https://unpkg.com/supersimpledev/react.js"></script>
  <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>
  <script src="https://unpkg.com/supersimpledev/babel.js"></script>


  <script type="text/babel">

    function ChatInput() {
      return (
        <>
          <input 
            placeholder="Send the message to ChatBot" 
            size = "30"
          />
          <button>Send</button>
        </>
      );
    }

    function ChatMessage({message, user}){

      if (user === 'bot') {
        return(
            <div>
              <img src="./assests/bot.png" alt="user" width ="50"></img>
              {message}
            </div>
        );
      }
      return(
        <div>
          {message}
          <img src="./assests/user.png" alt="user" width ="50"></img>
        </div>
      );
    }

    function App() {
      return (
        <>
          <ChatInput />
          <ChatMessage message="hello ChatBot" user="user"/>
          <ChatMessage message="hello ChatBot" user="bot"/>
          <ChatMessage message="hello ChatBot" user="user"/>
          <ChatMessage message="hello ChatBot" user="bot"/>

        </>
      );
    }

    const container = document.querySelector('.js-container');
    ReactDOM.createRoot(container).render(
      <App />
    );

  </script>
</body>

</html>
